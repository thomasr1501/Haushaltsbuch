<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haushaltsbuch PWA</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      /* Fitness App Theme: Schwarz & Türkis */
      --bg-main: #000000;
      --bg-card: #121212;
      --bg-input: #1a1a1a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --border: #2a2a2a;
      
      /* Akzente */
      --accent-primary: #00e5ff; /* Leuchtendes Türkis */
      --accent-primary-hover: #00cce6;
      --accent-green: #00e676;
      --accent-red: #ff3d00;
      
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-primary);
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      gap: 0.5rem;
      background-color: var(--bg-card);
      padding: 0.35rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.65rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .tab-btn.active {
      background-color: var(--accent-primary);
      color: #000000; /* Dunkler Text für Kontrast auf Türkis */
    }

    /* Statistiken Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      padding: 0.85rem 0.65rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-card.balance .stat-value { color: var(--text-primary); }
    .stat-card.income .stat-value { color: var(--accent-green); }
    .stat-card.expense .stat-value { color: var(--accent-red); }

    /* Container & Formular */
    .card-section {
      background-color: var(--bg-card);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .transaction-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }

    /* Custom Category Input Wrapper */
    .input-with-btn {
      display: flex;
      gap: 0.5rem;
    }
    .input-with-btn select {
      flex: 1;
    }
    .btn-icon {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--accent-primary);
      width: 40px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s;
    }
    .btn-icon:hover {
      border-color: var(--accent-primary);
    }

    label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    input, select {
      width: 100%;
      min-width: 0;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      color-scheme: dark; /* Wichtig für Kalender-Popup in dunkel */
    }

    input:focus, select:focus {
      border-color: var(--accent-primary);
    }

    .btn-primary {
      background-color: var(--accent-primary);
      color: #000000;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
    }

    /* Listen */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .transaction-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .transaction-item {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .item-main {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .item-category {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .item-amount {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .item-amount.income { color: var(--accent-green); }
    .item-amount.expense { color: var(--accent-red); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .btn-delete:hover {
      color: var(--accent-red);
      background-color: rgba(255, 61, 0, 0.1);
    }

    /* Kategorie-Archiv */
    .category-group {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .category-group-header {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 0.75rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .category-group-list {
      list-style: none;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }

    .view-content {
      display: none;
    }

    .view-content.active {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Chart Container */
    .chart-container {
      position: relative;
      height: 250px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (max-width: 480px) {
      body { padding: 0.5rem; }
      .form-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <header class="app-header">
      <h1>Haushaltsbuch</h1>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-view="entry-view">Erfassung</button>
      <button class="tab-btn" data-view="archive-view">Kategorien</button>
      <button class="tab-btn" data-view="chart-view">Auswertung</button>
    </nav>

    <!-- Globale Statistiken -->
    <div class="stats-grid">
      <div class="stat-card balance">
        <span class="stat-label">Gesamtsaldo</span>
        <span class="stat-value" id="total-balance">0,00 €</span>
      </div>
      <div class="stat-card income">
        <span class="stat-label">Einnahmen</span>
        <span class="stat-value" id="total-income">+0,00 €</span>
      </div>
      <div class="stat-card expense">
        <span class="stat-label">Ausgaben</span>
        <span class="stat-value" id="total-expense">-0,00 €</span>
      </div>
    </div>

    <!-- TAB 1: Erfassung & Neueste Buchungen -->
    <main id="entry-view" class="view-content active">
      <section class="card-section">
        <h2>Neue Buchung</h2>
        <form id="transaction-form" class="transaction-form">
          <div class="form-row">
            <div class="form-group">
              <label for="amount">Betrag (€)</label>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
            </div>
            <div class="form-group">
              <label for="type">Typ</label>
              <select id="type" required>
                <option value="expense">Ausgabe</option>
                <option value="income">Einnahme</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Kategorie</label>
              <div class="input-with-btn">
                <select id="category" required>
                  <!-- Wird per JavaScript befüllt -->
                </select>
                <button type="button" id="add-category-btn" class="btn-icon" title="Neue Kategorie hinzufügen">+</button>
              </div>
            </div>
            <div class="form-group">
              <label for="date">Datum</label>
              <input type="date" id="date" required>
            </div>
          </div>

          <div class="form-group">
            <label for="note">Notiz (optional)</label>
            <input type="text" id="note" placeholder="z. B. Supermarkteinkauf">
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">Buchung speichern</button>
        </form>
      </section>

      <section class="card-section">
        <div class="section-header">
          <h2>Neueste Buchungen</h2>
          <select id="type-filter" style="width: auto;">
            <option value="all">Alle</option>
            <option value="expense">Ausgaben</option>
            <option value="income">Einnahmen</option>
          </select>
        </div>
        <ul id="transaction-list" class="transaction-list"></ul>
      </section>
    </main>

    <!-- TAB 2: Kategorie-Archiv -->
    <main id="archive-view" class="view-content">
      <section class="card-section">
        <h2>Übersicht nach Kategorien</h2>
        <div id="category-archive-container"></div>
      </section>
    </main>

    <!-- TAB 3: Chart-Auswertung -->
    <main id="chart-view" class="view-content">
      <section class="card-section">
        <h2>Ausgabenverteilung</h2>
        <div class="chart-container">
          <canvas id="expenseChart"></canvas>
        </div>
      </section>
    </main>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Firebase Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyAOR__FV6ujC-a7W5mdw_Bq_ozL9L3rwAw",
      authDomain: "haushaltsbuch-b2a0f.firebaseapp.com",
      projectId: "haushaltsbuch-b2a0f",
      storageBucket: "haushaltsbuch-b2a0f.firebasestorage.app",
      messagingSenderId: "836022748250",
      appId: "1:836022748250:web:8db4d8477ea19d7d38c463"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION_NAME = "transactions";

    // Basis-Kategorien
    const DEFAULT_CATEGORIES = {
      expense: ["Lebensmittel & Haushalt", "Fixkosten & Abos", "Freizeit & Hobby", "Transport & Tanken", "Werkzeug & Material", "Sonstiges"],
      income: ["Gehalt & Lohn", "Nebengewerbe / Selbstständigkeit", "Rückzahlung & Erstattung", "Geschenk / Bonus", "Sonstiges"]
    };

    // State
    let transactions = [];
    let customCategories = { expense: [], income: [] };
    let expenseChartInstance = null; // Hält die Chart-Instanz

    // DOM Referenzen
    const form = document.getElementById("transaction-form");
    const typeSelect = document.getElementById("type");
    const categorySelect = document.getElementById("category");
    const addCatBtn = document.getElementById("add-category-btn");
    const dateInput = document.getElementById("date");
    const list = document.getElementById("transaction-list");
    const typeFilter = document.getElementById("type-filter");
    const submitBtn = document.getElementById("submit-btn");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const archiveContainer = document.getElementById("category-archive-container");

    const totalBalanceEl = document.getElementById("total-balance");
    const totalIncomeEl = document.getElementById("total-income");
    const totalExpenseEl = document.getElementById("total-expense");

    // Init
    document.addEventListener("DOMContentLoaded", async () => {
      loadCustomCategories();
      dateInput.value = new Date().toISOString().split("T")[0];
      updateCategoryOptions();
      
      await loadAndRenderData();

      typeSelect.addEventListener("change", updateCategoryOptions);
      form.addEventListener("submit", handleFormSubmit);
      typeFilter.addEventListener("change", renderRecentList);
      addCatBtn.addEventListener("click", handleAddCustomCategory);

      tabBtns.forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.view));
      });
    });

    // Custom Kategorien laden/speichern
    function loadCustomCategories() {
      const saved = localStorage.getItem("budget_custom_categories");
      if (saved) customCategories = JSON.parse(saved);
    }
    
    function saveCustomCategories() {
      localStorage.setItem("budget_custom_categories", JSON.stringify(customCategories));
    }

    function handleAddCustomCategory() {
      const selectedType = typeSelect.value;
      const typeName = selectedType === "expense" ? "Ausgabe" : "Einnahme";
      const newCat = prompt(`Neue Kategorie für ${typeName} eingeben:`);
      
      if (newCat && newCat.trim() !== "") {
        const catName = newCat.trim();
        // Prüfen ob bereits vorhanden
        const allCats = [...DEFAULT_CATEGORIES[selectedType], ...customCategories[selectedType]];
        if (!allCats.includes(catName)) {
          customCategories[selectedType].push(catName);
          saveCustomCategories();
          updateCategoryOptions();
          categorySelect.value = catName; // Direkt auswählen
        } else {
          alert("Kategorie existiert bereits!");
        }
      }
    }

    function updateCategoryOptions() {
      const selectedType = typeSelect.value;
      const options = [...DEFAULT_CATEGORIES[selectedType], ...customCategories[selectedType]];
      categorySelect.innerHTML = options.map(cat => `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`).join("");
    }

    // Tab Navigation
    function switchTab(targetViewId) {
      tabBtns.forEach(btn => btn.classList.toggle("active", btn.dataset.view === targetViewId));
      document.querySelectorAll(".view-content").forEach(view => {
        const isActive = view.id === targetViewId;
        view.classList.toggle("active", isActive);
      });

      // Chart neu zeichnen wenn Tab aktiv wird
      if (targetViewId === "chart-view") {
        renderChart();
      }
    }

    // DB Operationen
    async function loadAndRenderData() {
      list.innerHTML = `<li class="empty-state">Lade Buchungen...</li>`;
      try {
        const querySnapshot = await getDocs(collection(db, COLLECTION_NAME));
        transactions = querySnapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        renderStats();
        renderRecentList();
        renderArchiveView();
        
        // Chart updaten falls wir gerade im Chart-Tab sind
        if (document.getElementById("chart-view").classList.contains("active")) {
          renderChart();
        }
      } catch (err) {
        console.error(err);
        list.innerHTML = `<li class="empty-state" style="color: var(--accent-red);">Fehler beim Laden</li>`;
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Speichere...";

      try {
        await addDoc(collection(db, COLLECTION_NAME), {
          amount: parseFloat(document.getElementById("amount").value),
          type: typeSelect.value,
          category: categorySelect.value,
          date: dateInput.value,
          note: document.getElementById("note").value.trim(),
          createdAt: serverTimestamp()
        });
        form.reset();
        dateInput.value = new Date().toISOString().split("T")[0];
        updateCategoryOptions();
        await loadAndRenderData();
      } catch (err) {
        alert("Fehler!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Speichern";
      }
    }

    async function handleDelete(e) {
      const id = e.target.getAttribute("data-id");
      if (!id) return;
      if (confirm("Löschen?")) {
        await deleteDoc(doc(db, COLLECTION_NAME, id));
        await loadAndRenderData();
      }
    }

    // UI Rendering
    function renderStats() {
      const totals = transactions.reduce((acc, t) => {
        const amt = Number(t.amount) || 0;
        t.type === "income" ? acc.income += amt : acc.expense += amt;
        return acc;
      }, { income: 0, expense: 0 });

      totalBalanceEl.textContent = formatCurrency(totals.income - totals.expense);
      totalIncomeEl.textContent = `+${formatCurrency(totals.income)}`;
      totalExpenseEl.textContent = `-${formatCurrency(totals.expense)}`;
    }

    function renderRecentList() {
      const f = typeFilter.value;
      const filtered = transactions.filter(t => f === "all" || t.type === f);
      
      if (!filtered.length) {
        list.innerHTML = `<li class="empty-state">Keine Buchungen</li>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <li class="transaction-item">
          <div class="item-main">
            <span class="item-category">${escapeHTML(t.category)}</span>
            <span class="item-meta">${formatDate(t.date)}${t.note ? ` • ${escapeHTML(t.note)}` : ""}</span>
          </div>
          <div class="item-right">
            <span class="item-amount ${t.type === 'income' ? 'income' : 'expense'}">${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}</span>
            <button class="btn-delete" data-id="${t.id}">✕</button>
          </div>
        </li>
      `).join("");
      
      list.querySelectorAll(".btn-delete").forEach(btn => btn.addEventListener("click", handleDelete));
    }

    function renderArchiveView() {
      if (!transactions.length) {
        archiveContainer.innerHTML = `<p class="empty-state">Leer</p>`;
        return;
      }

      const grouped = {};
      transactions.forEach(t => {
        const c = t.category || "Sonstiges";
        if (!grouped[c]) grouped[c] = { items: [], in: 0, out: 0 };
        grouped[c].items.push(t);
        t.type === "income" ? grouped[c].in += Number(t.amount) : grouped[c].out += Number(t.amount);
      });

      archiveContainer.innerHTML = Object.keys(grouped).map(cat => {
        const net = grouped[cat].in - grouped[cat].out;
        const isPos = net >= 0;
        
        return `
          <div class="category-group">
            <div class="category-group-header">
              <span>${escapeHTML(cat)}</span>
              <span class="item-amount ${isPos ? 'income' : 'expense'}">${isPos ? '+' : '-'}${formatCurrency(Math.abs(net))}</span>
            </div>
            <ul class="category-group-list">
              ${grouped[cat].items.map(t => `
                <li class="transaction-item" style="padding: 0.5rem">
                  <div class="item-main"><span class="item-meta">${formatDate(t.date)}${t.note ? ` • ${escapeHTML(t.note)}` : ""}</span></div>
                  <div class="item-right">
                    <span class="item-amount ${t.type === 'income' ? 'income' : 'expense'}">${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}</span>
                    <button class="btn-delete" data-id="${t.id}">✕</button>
                  </div>
                </li>
              `).join("")}
            </ul>
          </div>
        `;
      }).join("");
      archiveContainer.querySelectorAll(".btn-delete").forEach(b => b.addEventListener("click", handleDelete));
    }

    // Chart.js Rendering
    function renderChart() {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      
      // Nur Ausgaben filtern
      const expenses = transactions.filter(t => t.type === 'expense');
      
      if (expenses.length === 0) {
        // Falls Chart existiert, zerstören
        if (expenseChartInstance) {
          expenseChartInstance.destroy();
          expenseChartInstance = null;
        }
        return;
      }

      // Gruppieren und Summieren
      const categoryTotals = {};
      expenses.forEach(t => {
        const cat = t.category || "Sonstiges";
        categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(t.amount);
      });

      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      // Fitness Theme Farben generieren (Türkis, Grün, Orange, Lila, etc.)
      const bgColors = [
        '#00e5ff', '#00e676', '#ffea00', '#ff3d00', '#d500f9', '#2979ff', '#1de9b6', '#ff9100'
      ];

      // Altes Chart zerstören bevor neues gerendert wird (verhindert Hover-Glitches)
      if (expenseChartInstance) {
        expenseChartInstance.destroy();
      }

      expenseChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: bgColors.slice(0, labels.length),
            borderWidth: 2,
            borderColor: '#121212' // Hintergrundfarbe der Card
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                color: '#ffffff',
                font: { size: 12 }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let value = context.raw;
                  return ' ' + formatCurrency(value);
                }
              }
            }
          }
        }
      });
    }

    // Helper
    function formatCurrency(n) {
      return Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function formatDate(d) {
      return new Date(d).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    }
    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, m => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[m]);
    }
  </script>
</body>
