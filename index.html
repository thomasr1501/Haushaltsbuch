<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haushaltsbuch PWA</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --bg-input: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Header & Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      padding: 1rem 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stat-card.balance .stat-value { color: var(--text-primary); }
    .stat-card.income .stat-value { color: var(--accent-green); }
    .stat-card.expense .stat-value { color: var(--accent-red); }

    /* Form & Section Cards */
    .card-section {
      background-color: var(--bg-card);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .transaction-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    input, select {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Transaktionsliste */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .transaction-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .transaction-item {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      padding: 0.85rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-main {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .item-category {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .item-amount {
      font-weight: 700;
      font-size: 1rem;
    }

    .item-amount.income { color: var(--accent-green); }
    .item-amount.expense { color: var(--accent-red); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .btn-delete:hover {
      color: var(--accent-red);
      background-color: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Header & Statistiken -->
    <header class="app-header">
      <h1>Haushaltsbuch</h1>
      <div class="stats-grid">
        <div class="stat-card balance">
          <span class="stat-label">Gesamtsaldo</span>
          <span class="stat-value" id="total-balance">0,00 €</span>
        </div>
        <div class="stat-card income">
          <span class="stat-label">Einnahmen</span>
          <span class="stat-value" id="total-income">+0,00 €</span>
        </div>
        <div class="stat-card expense">
          <span class="stat-label">Ausgaben</span>
          <span class="stat-value" id="total-expense">-0,00 €</span>
        </div>
      </div>
    </header>

    <!-- Transaktion hinzufügen -->
    <section class="card-section">
      <h2>Neue Buchung</h2>
      <form id="transaction-form" class="transaction-form">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Betrag (€)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
          </div>
          <div class="form-group">
            <label for="type">Typ</label>
            <select id="type" required>
              <option value="expense">Ausgabe</option>
              <option value="income">Einnahme</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Kategorie</label>
            <select id="category" required>
              <option value="Lebensmittel">Lebensmittel & Haushalt</option>
              <option value="Fixkosten">Fixkosten & Abos</option>
              <option value="Freizeit">Freizeit & Hobby</option>
              <option value="Transport">Transport & Tanken</option>
              <option value="Werkzeug">Werkzeug & Material</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Datum</label>
            <input type="date" id="date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="note">Notiz (optional)</label>
          <input type="text" id="note" placeholder="z. B. Supermarkteinkauf">
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Buchung speichern</button>
      </form>
    </section>

    <!-- Transaktionshistorie -->
    <section class="card-section">
      <div class="section-header">
        <h2>Buchungen</h2>
        <div class="filter-controls">
          <select id="type-filter">
            <option value="all">Alle Typen</option>
            <option value="expense">Nur Ausgaben</option>
            <option value="income">Nur Einnahmen</option>
          </select>
        </div>
      </div>

      <ul id="transaction-list" class="transaction-list">
        <!-- Dynamische Einträge -->
      </ul>
    </section>

  </div>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      deleteDoc, 
      doc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAOR__FV6ujC-a7W5mdw_Bq_ozL9L3rwAw",
      authDomain: "haushaltsbuch-b2a0f.firebaseapp.com",
      projectId: "haushaltsbuch-b2a0f",
      storageBucket: "haushaltsbuch-b2a0f.firebasestorage.app",
      messagingSenderId: "836022748250",
      appId: "1:836022748250:web:8db4d8477ea19d7d38c463"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION_NAME = "transactions";

    // State
    let transactions = [];

    // DOM Referenzen
    const form = document.getElementById("transaction-form");
    const list = document.getElementById("transaction-list");
    const dateInput = document.getElementById("date");
    const typeFilter = document.getElementById("type-filter");
    const submitBtn = document.getElementById("submit-btn");

    const totalBalanceEl = document.getElementById("total-balance");
    const totalIncomeEl = document.getElementById("total-income");
    const totalExpenseEl = document.getElementById("total-expense");

    // Init
    document.addEventListener("DOMContentLoaded", async () => {
      dateInput.value = new Date().toISOString().split("T")[0];
      await loadAndRenderData();

      form.addEventListener("submit", handleFormSubmit);
      typeFilter.addEventListener("change", renderList);
    });

    // DB Operations
    async function addTransactionToDB(data) {
      return await addDoc(collection(db, COLLECTION_NAME), {
        amount: parseFloat(data.amount),
        type: data.type,
        category: data.category,
        date: data.date,
        note: data.note || "",
        createdAt: serverTimestamp()
      });
    }

    async function getTransactionsFromDB() {
      const querySnapshot = await getDocs(collection(db, COLLECTION_NAME));
      const items = querySnapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));
      return items.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    async function deleteTransactionFromDB(id) {
      await deleteDoc(doc(db, COLLECTION_NAME, id));
    }

    // UI Rendering & Handling
    async function loadAndRenderData() {
      list.innerHTML = `<li class="empty-state">Lade Buchungen...</li>`;
      try {
        transactions = await getTransactionsFromDB();
        renderStats();
        renderList();
      } catch (err) {
        console.error(err);
        list.innerHTML = `<li class="empty-state" style="color: var(--accent-red);">Fehler beim Laden der Daten!</li>`;
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const formData = {
        amount: document.getElementById("amount").value,
        type: document.getElementById("type").value,
        category: document.getElementById("category").value,
        date: document.getElementById("date").value,
        note: document.getElementById("note").value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Speichere...";

      try {
        await addTransactionToDB(formData);
        form.reset();
        dateInput.value = new Date().toISOString().split("T")[0];
        await loadAndRenderData();
      } catch (err) {
        alert("Speichern fehlgeschlagen.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Buchung speichern";
      }
    }

    function renderStats() {
      const totals = transactions.reduce((acc, t) => {
        const amount = Number(t.amount) || 0;
        if (t.type === "income") {
          acc.income += amount;
        } else {
          acc.expense += amount;
        }
        return acc;
      }, { income: 0, expense: 0 });

      const balance = totals.income - totals.expense;

      totalBalanceEl.textContent = formatCurrency(balance);
      totalIncomeEl.textContent = `+${formatCurrency(totals.income)}`;
      totalExpenseEl.textContent = `-${formatCurrency(totals.expense)}`;
    }

    function renderList() {
      const selectedType = typeFilter.value;
      const filtered = transactions.filter(t => selectedType === "all" || t.type === selectedType);

      if (filtered.length === 0) {
        list.innerHTML = `<li class="empty-state">Keine Buchungen vorhanden.</li>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const isIncome = item.type === "income";
        const prefix = isIncome ? "+" : "-";
        const amountClass = isIncome ? "income" : "expense";
        const formattedDate = new Date(item.date).toLocaleDateString("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        });

        return `
          <li class="transaction-item">
            <div class="item-main">
              <span class="item-category">${escapeHTML(item.category)}</span>
              <span class="item-meta">${formattedDate}${item.note ? ` • ${escapeHTML(item.note)}` : ""}</span>
            </div>
            <div class="item-right">
              <span class="item-amount ${amountClass}">${prefix}${formatCurrency(item.amount)}</span>
              <button class="btn-delete" data-id="${item.id}" title="Löschen">✕</button>
            </div>
          </li>
        `;
      }).join("");

      document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", handleDelete);
      });
    }

    async function handleDelete(e) {
      const id = e.target.getAttribute("data-id");
      if (!id) return;

      if (confirm("Möchtest du diese Buchung wirklich löschen?")) {
        try {
          await deleteTransactionFromDB(id);
          await loadAndRenderData();
        } catch (err) {
          alert("Löschen fehlgeschlagen.");
        }
      }
    }

    function formatCurrency(num) {
      return Number(num).toLocaleString("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, match => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[match]);
    }
  </script>
</body>
</html>
