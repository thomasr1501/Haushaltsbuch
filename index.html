<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haushaltsbuch PWA</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      gap: 0.5rem;
      background-color: var(--bg-card);
      padding: 0.35rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.65rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .tab-btn.active {
      background-color: var(--accent-blue);
      color: white;
    }

    /* Statistiken Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      padding: 0.85rem 0.65rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-card.balance .stat-value { color: var(--text-primary); }
    .stat-card.income .stat-value { color: var(--accent-green); }
    .stat-card.expense .stat-value { color: var(--accent-red); }

    /* Container & Formular */
    .card-section {
      background-color: var(--bg-card);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .transaction-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    input, select {
      width: 100%;
      min-width: 0;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Listen & Historie */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .transaction-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .transaction-item {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .item-main {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .item-category {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .item-amount {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .item-amount.income { color: var(--accent-green); }
    .item-amount.expense { color: var(--accent-red); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .btn-delete:hover {
      color: var(--accent-red);
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* Kategorie-Archiv Gruppierung */
    .category-group {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .category-group-header {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 0.75rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .category-group-list {
      list-style: none;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }

    .view-content {
      display: none;
    }

    .view-content.active {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Responsives Verhalten für Mobile Screens */
    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <header class="app-header">
      <h1>Haushaltsbuch</h1>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-view="entry-view">Erfassung</button>
      <button class="tab-btn" data-view="archive-view">Kategorie-Übersicht</button>
    </nav>

    <!-- Globale Statistiken -->
    <div class="stats-grid">
      <div class="stat-card balance">
        <span class="stat-label">Gesamtsaldo</span>
        <span class="stat-value" id="total-balance">0,00 €</span>
      </div>
      <div class="stat-card income">
        <span class="stat-label">Einnahmen</span>
        <span class="stat-value" id="total-income">+0,00 €</span>
      </div>
      <div class="stat-card expense">
        <span class="stat-label">Ausgaben</span>
        <span class="stat-value" id="total-expense">-0,00 €</span>
      </div>
    </div>

    <!-- TAB 1: Erfassung & Neueste Buchungen -->
    <main id="entry-view" class="view-content active">
      <section class="card-section">
        <h2>Neue Buchung</h2>
        <form id="transaction-form" class="transaction-form">
          <div class="form-row">
            <div class="form-group">
              <label for="amount">Betrag (€)</label>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
            </div>
            <div class="form-group">
              <label for="type">Typ</label>
              <select id="type" required>
                <option value="expense">Ausgabe</option>
                <option value="income">Einnahme</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Kategorie</label>
              <select id="category" required>
                <!-- Wird per JavaScript befüllt -->
              </select>
            </div>
            <div class="form-group">
              <label for="date">Datum</label>
              <input type="date" id="date" required>
            </div>
          </div>

          <div class="form-group">
            <label for="note">Notiz (optional)</label>
            <input type="text" id="note" placeholder="z. B. Supermarkteinkauf">
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">Buchung speichern</button>
        </form>
      </section>

      <section class="card-section">
        <div class="section-header">
          <h2>Neueste Buchungen</h2>
          <select id="type-filter" style="width: auto;">
            <option value="all">Alle</option>
            <option value="expense">Ausgaben</option>
            <option value="income">Einnahmen</option>
          </select>
        </div>

        <ul id="transaction-list" class="transaction-list">
          <!-- Dynamischer Inhalt -->
        </ul>
      </section>
    </main>

    <!-- TAB 2: Kategorie-Archiv -->
    <main id="archive-view" class="view-content">
      <section class="card-section">
        <h2>Übersicht nach Kategorien</h2>
        <div id="category-archive-container">
          <!-- Gruppierte Einträge -->
        </div>
      </section>
    </main>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      deleteDoc, 
      doc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Firebase Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyAOR__FV6ujC-a7W5mdw_Bq_ozL9L3rwAw",
      authDomain: "haushaltsbuch-b2a0f.firebaseapp.com",
      projectId: "haushaltsbuch-b2a0f",
      storageBucket: "haushaltsbuch-b2a0f.firebasestorage.app",
      messagingSenderId: "836022748250",
      appId: "1:836022748250:web:8db4d8477ea19d7d38c463"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION_NAME = "transactions";

    // Kategorien Zuordnung
    const CATEGORIES = {
      expense: [
        "Lebensmittel & Haushalt",
        "Fixkosten & Abos",
        "Freizeit & Hobby",
        "Transport & Tanken",
        "Werkzeug & Material",
        "Sonstiges"
      ],
      income: [
        "Gehalt & Lohn",
        "Nebengewerbe / Selbstständigkeit",
        "Rückzahlung & Erstattung",
        "Geschenk / Bonus",
        "Sonstiges"
      ]
    };

    // State
    let transactions = [];

    // DOM Referenzen
    const form = document.getElementById("transaction-form");
    const typeSelect = document.getElementById("type");
    const categorySelect = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const list = document.getElementById("transaction-list");
    const typeFilter = document.getElementById("type-filter");
    const submitBtn = document.getElementById("submit-btn");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const archiveContainer = document.getElementById("category-archive-container");

    const totalBalanceEl = document.getElementById("total-balance");
    const totalIncomeEl = document.getElementById("total-income");
    const totalExpenseEl = document.getElementById("total-expense");

    // Init
    document.addEventListener("DOMContentLoaded", async () => {
      dateInput.value = new Date().toISOString().split("T")[0];
      updateCategoryOptions();
      
      await loadAndRenderData();

      typeSelect.addEventListener("change", updateCategoryOptions);
      form.addEventListener("submit", handleFormSubmit);
      typeFilter.addEventListener("change", renderRecentList);

      tabBtns.forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.view));
      });
    });

    // Dynamische Kategorien anpassen
    function updateCategoryOptions() {
      const selectedType = typeSelect.value;
      const options = CATEGORIES[selectedType] || [];
      categorySelect.innerHTML = options.map(cat => `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`).join("");
    }

    // Tab Wechsel
    function switchTab(targetViewId) {
      tabBtns.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === targetViewId);
      });
      document.querySelectorAll(".view-content").forEach(view => {
        view.classList.toggle("active", view.id === targetViewId);
      });
    }

    // DB Operationen
    async function addTransactionToDB(data) {
      return await addDoc(collection(db, COLLECTION_NAME), {
        amount: parseFloat(data.amount),
        type: data.type,
        category: data.category,
        date: data.date,
        note: data.note || "",
        createdAt: serverTimestamp()
      });
    }

    async function getTransactionsFromDB() {
      const querySnapshot = await getDocs(collection(db, COLLECTION_NAME));
      const items = querySnapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));
      return items.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    async function deleteTransactionFromDB(id) {
      await deleteDoc(doc(db, COLLECTION_NAME, id));
    }

    // UI Rendering
    async function loadAndRenderData() {
      list.innerHTML = `<li class="empty-state">Lade Buchungen...</li>`;
      archiveContainer.innerHTML = `<p class="empty-state">Lade Kategorien...</p>`;
      try {
        transactions = await getTransactionsFromDB();
        renderStats();
        renderRecentList();
        renderArchiveView();
      } catch (err) {
        console.error(err);
        list.innerHTML = `<li class="empty-state" style="color: var(--accent-red);">Fehler beim Laden der Daten!</li>`;
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const formData = {
        amount: document.getElementById("amount").value,
        type: typeSelect.value,
        category: categorySelect.value,
        date: dateInput.value,
        note: document.getElementById("note").value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Speichere...";

      try {
        await addTransactionToDB(formData);
        form.reset();
        dateInput.value = new Date().toISOString().split("T")[0];
        updateCategoryOptions();
        await loadAndRenderData();
      } catch (err) {
        alert("Speichern fehlgeschlagen.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Buchung speichern";
      }
    }

    function renderStats() {
      const totals = transactions.reduce((acc, t) => {
        const amount = Number(t.amount) || 0;
        if (t.type === "income") {
          acc.income += amount;
        } else {
          acc.expense += amount;
        }
        return acc;
      }, { income: 0, expense: 0 });

      const balance = totals.income - totals.expense;

      totalBalanceEl.textContent = formatCurrency(balance);
      totalIncomeEl.textContent = `+${formatCurrency(totals.income)}`;
      totalExpenseEl.textContent = `-${formatCurrency(totals.expense)}`;
    }

    function renderRecentList() {
      const selectedType = typeFilter.value;
      const filtered = transactions.filter(t => selectedType === "all" || t.type === selectedType);

      if (filtered.length === 0) {
        list.innerHTML = `<li class="empty-state">Keine Buchungen vorhanden.</li>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const isIncome = item.type === "income";
        const prefix = isIncome ? "+" : "-";
        const amountClass = isIncome ? "income" : "expense";
        const formattedDate = new Date(item.date).toLocaleDateString("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        });

        return `
          <li class="transaction-item">
            <div class="item-main">
              <span class="item-category">${escapeHTML(item.category)}</span>
              <span class="item-meta">${formattedDate}${item.note ? ` • ${escapeHTML(item.note)}` : ""}</span>
            </div>
            <div class="item-right">
              <span class="item-amount ${amountClass}">${prefix}${formatCurrency(item.amount)}</span>
              <button class="btn-delete" data-id="${item.id}" title="Löschen">✕</button>
            </div>
          </li>
        `;
      }).join("");

      list.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", handleDelete);
      });
    }

    function renderArchiveView() {
      if (transactions.length === 0) {
        archiveContainer.innerHTML = `<p class="empty-state">Keine Buchungen für das Archiv vorhanden.</p>`;
        return;
      }

      // Gruppierung nach Kategorie
      const grouped = {};
      transactions.forEach(t => {
        const cat = t.category || "Sonstiges";
        if (!grouped[cat]) {
          grouped[cat] = {
            items: [],
            incomeTotal: 0,
            expenseTotal: 0
          };
        }
        grouped[cat].items.push(t);
        if (t.type === "income") {
          grouped[cat].incomeTotal += Number(t.amount) || 0;
        } else {
          grouped[cat].expenseTotal += Number(t.amount) || 0;
        }
      });

      archiveContainer.innerHTML = Object.keys(grouped).map(catName => {
        const group = grouped[catName];
        const net = group.incomeTotal - group.expenseTotal;
        const isPositive = net >= 0;
        const totalClass = isPositive ? "income" : "expense";
        const prefix = isPositive ? "+" : "-";

        const itemsHTML = group.items.map(item => {
          const isIncome = item.type === "income";
          const formattedDate = new Date(item.date).toLocaleDateString("de-DE", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          });

          return `
            <li class="transaction-item">
              <div class="item-main">
                <span class="item-meta">${formattedDate}${item.note ? ` • ${escapeHTML(item.note)}` : ""}</span>
              </div>
              <div class="item-right">
                <span class="item-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${formatCurrency(item.amount)}</span>
                <button class="btn-delete" data-id="${item.id}" title="Löschen">✕</button>
              </div>
            </li>
          `;
        }).join("");

        return `
          <div class="category-group">
            <div class="category-group-header">
              <span>${escapeHTML(catName)}</span>
              <span class="item-amount ${totalClass}">${prefix}${formatCurrency(Math.abs(net))}</span>
            </div>
            <ul class="category-group-list">
              ${itemsHTML}
            </ul>
          </div>
        `;
      }).join("");

      archiveContainer.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", handleDelete);
      });
    }

    async function handleDelete(e) {
      const id = e.target.getAttribute("data-id");
      if (!id) return;

      if (confirm("Möchtest du diese Buchung wirklich löschen?")) {
        try {
          await deleteTransactionFromDB(id);
          await loadAndRenderData();
        } catch (err) {
          alert("Löschen fehlgeschlagen.");
        }
      }
    }

    function formatCurrency(num) {
      return Number(num).toLocaleString("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, match => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[match]);
    }
  </script>
</body>
</html>
